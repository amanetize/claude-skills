name: Sync skills

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: [upstream.tsv, scripts/sync.sh]

permissions:
  contents: write

concurrency:
  group: sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Rebuild skills from upstream repos
        run: scripts/sync.sh

      - name: Commit changes to main
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "Nothing changed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Sync skills from upstream" -m "$(cat upstream.lock)"
          git push
